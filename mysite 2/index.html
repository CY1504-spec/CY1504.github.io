<!DOCTYPE html>
<html>
<!-- 幅は900px -->

<head>
    <!-- リンク　フォントやcssや画像をリンクさせる -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>


    <!-- タイトル名 -->
    <title>home - ART WEB!</title>
</head>

<body>
    <header>
        <div class="pattern">
            <div class="wrap">
                <span class="title-name">MY-ART-WEB</span>
                <!-- メニュー -->
                <nav>
                    <div class="menu">
                        <a href="index.html">home</a>
                        <a href="gallery.html">gallery</a>
                        <a href="about.html">about</a>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <div class="wrap">
            <div class="box1">
                <img src="samune.jpg" alt="">
            </div>

            <div class="flex">
                <div class="news">
                    <h3>News</h3>
                    <a href="">2026/06/16　イラスト更新</a>
                    <a href="">2026/06/16　イラスト更新</a>
                    
                </div>

                <div class="news">
                    <h4>
                        <P>
                            サイトへようこそ‼️<br>
                            このサイトでは<br>
                            『自主制作の作品』や『イラストレーション』や『写真』を載せていく予定です。
                            <br><br>
                        </P>
                </div>

            </div>

            <!-- Slider main container -->
            <div class="swiper box2">
                <!-- Additional required wrapper -->
                <div class="swiper-wrapper">
                    <!-- Slides -->
                    <div class="swiper-slide">
                        <img src="mozya.jpg" alt="">
                        
                    </div>
                    <div class="swiper-slide">
                        <img src="niji.jpg" alt="">
                    </div>
                    <div class="swiper-slide">
                        <img src="sen.jpg" alt="">
                    </div>
                    ...
                </div>

                <!-- If we need navigation buttons -->
                <!-- 矢印押すとスライド -->
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>

                <!-- If we need scrollbar -->
                <!-- スクロールバー -->
                <div class="swiper-scrollbar"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="pattern">
            <div class="wrap">
                <div class="footer-item">
                    <h3>MY-ART-WEB</h3>
                    <!-- ©︎は&copy; -->
                    <h5>&copy; 2026 MY-ART-WEB.</h5>
                </div>
            </div>
        </div>
    </footer>

    <!-- js -->
    <script>
        const swiper = new Swiper('.swiper', {
            // Optional parameters
            direction: 'horizontal',
            loop: true,
            autoplay: {
                delay: 3000, // ミリ秒
            },

            // If we need pagination
            pagination: {
                el: '.swiper-pagination',
            },

            // Navigation arrows
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },

            // And if we need scrollbar
            scrollbar: {
                el: '.swiper-scrollbar',
            },
        });
    </script>

</body>

</html>
