<!DOCTYPE html>
<html>
<!-- 幅は900px -->

<head>
    <!-- リンク　フォントやcssや画像をリンクさせる -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>


    <!-- タイトル名 -->
    <title>gallery - ART WEB!</title>
</head>

<body>
    <header>
        
        <div class="pattern">
            <div class="wrap">
                <span class="title-name">MY-ART-WEB</span>
                <!-- メニュー -->
                <nav>
                    <div class="menu">
                        <a href="index.html">home</a>
                        <a href="gallery.html">gallery</a>
                        <a href="about.html">about</a>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <div class="wrap">
            <div class="g_box">
                <img src="iii.jpg" class="clickable-img" alt>
                <img src="mozya.jpg" class="clickable-img"alt>
            </div>
            <div class="g_box">
                <img src="niji.jpg" class="clickable-img"alt>
                <img src="girl .jpg" class="clickable-img"alt>
            </div>
                <div class="g_box">
                    <img src="ooo.jpg"class="clickable-img"alt>
                    <img src="sen.jpg" class="clickable-img"alt>
                </div>
            </div>
            <div class="img-modal">
              <img class="modal-photo" src="" alt="">
            </div>
            <script>(function() {
                var thumbs = document.querySelectorAll('.clickable-img');
                var modal = document.querySelector('.img-modal');
                var photo = document.querySelector('.modal-photo');
              
                if (!modal || !photo) return;
              
                document.body.appendChild(modal);
              
                thumbs.forEach(function(thumb) {
                  thumb.addEventListener('click', function() {
                    photo.src = thumb.src;
                    modal.className = 'img-modal open';
                  });
                });
              
                modal.addEventListener('click', function() {
                  modal.className = 'img-modal';
                  photo.src = '';
                });
              })();</script>
            
    </main>

    <footer>
        <div class="pattern">
            <div class="wrap">
                <div class="footer-item">
                    <h3>MY-ART-WEB</h3>
                    <!-- ©︎は&copy; -->
                    <h5>&copy; 2026 MY-ART-WEB.</h5>
                </div>
            </div>
        </div>
    </footer>

</body>

</html>
